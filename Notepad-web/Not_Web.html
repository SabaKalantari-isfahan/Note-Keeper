<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>not web</title>
    <link rel="stylesheet" href="./bootstrap-5.3.2-dist/css/bootstrap.min.css">
    <style>
        #btn{
            padding: 5px 10px;
            background-color: rgb(1, 169, 1);
            border-radius: 10px;
            width: 90%;
            margin-top: 10px;
            color: white;
            border: 0;
            box-shadow: 1px 1px 5px 1px rgba(141, 144, 148, 0.764);
        }
        #inp{
            border-radius: 10px;
            outline: none;
            width: 90%;
            padding: 5px;
            display: block;
            box-shadow: 1px 1px 5px 1px rgba(141, 144, 148, 0.764);
            border: 0;
        }
        #not-box{
            border-radius: 10px;
            padding: 10px;
            box-shadow: 1px 1px 5px 1px rgba(141, 144, 148, 0.764);
            font-family: monospace;
        }
        .text-not{
            color: rgb(250, 235, 29);
        }
        #not div{
            border: 1px solid rgb(211, 217, 223);
            border-radius: 10px;
        }
        #not div button{
            padding: 5px;
            color: white;
            background-color: rgb(200, 11, 11);
            border-radius: 10px;
        }
        #not div input[type=checkbox]{
            border: 1px solid lightslategray;
            
        }
        #not-box div{
            margin-top: 20px;
            box-shadow: 1px 1px 5px 1px rgba(141, 144, 148, 0.764);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
        }
        #not-box input{
            width: 30px;
        }
        #not-box button{
            background-color: red;
            border: 0;
            color: white;
            border-radius: 15px;
            padding: 10px 30px;
        }
        #not-box p{
            padding-top: 3px;
            font-size: 20px;
        }
    </style>
</head>
<body style="padding: 50px;">
    <div class="row">
        <div class="send col-12 col-md-4 d-flex flex-column align-items-center">
            <input type="text" id="inp">
            <button id="btn">Add</button>
        </div>
        <div id="not-box" class="row col-12 col-md-8 mt-2 mt-md-0">
            <h3 class="text-not text-center text-md-start">My Note</h3>
        </div>
    </div>

    <script src="./js/jquery-3.7.1.min.js"></script>
    <script>
        var check
        var btn
        var div
        var text
        $('#btn').click(()=>{
            if ($('#inp').val() !=""){
                check = $('<input type="checkbox">')
                btn = $("<button>Delete</button>")
                btn.addClass("remove","col-12","col-md-3")
                text = $("<p></p>").text($('#inp').val());
                div = $("<div></div>")
                $("#not-box").append(div);
                $(div).append(check);
                $(div).append(text);
                $(div).append(btn);
                $('#inp').val("")
            }
        })
        btn.click(()=>{
            // alert($(this).parentNode)
            // $(this).parentNode.removeChild(btn)   
            alert("hi")
        })
    </script>
    <script src="./bootstrap-5.3.2-dist/js/bootstrap.bundle.js"></script>
</body>
</html>
